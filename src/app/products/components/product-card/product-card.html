
<div class="card bg-base-100 w-86 shadow-sm animate-fade-in">
  <figure>
    <img
      [src]="product().images | productImage"
      [alt]="product().title"
      [routerLink]="['/product',product().slug]" />
  </figure>
  <div class="card-body">
    <h2 class="card-title font-montserrat text-accent text-lg">{{ product().title }}</h2>
    <p> {{ product().description | slice:0:70 }} ... </p>
    <div class="card-actions justify-end">
        <a class="btn btn-accent" [routerLink]="['/product',product().slug]">Ver Mas</a>
    </div>
  </div>
</div>
