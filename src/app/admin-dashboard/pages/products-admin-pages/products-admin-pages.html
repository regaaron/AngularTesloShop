<h1 class="text-2xl font-bold">Listado de productos</h1>
<h3 class="text-xl">Total de Productos
    <span class="text-accent ">{{productResource.value()?.count}}</span>
</h3>

<div class="flex flex-row gap-2 items-center h-20">
    <app-pagination [pages]="productResource.value()?.pages ?? 0"
    [currentPage]="paginationService.currentPage()"
    />

    <select class="select select-bordered w-32"
        #selectPerPage
        (change)="onPerPageChange(); productsPerPage.set(+selectPerPage.value);"
       
    >
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="50">50</option>
        <option value="100">100</option>

    </select>
</div>
<app-poruduct-table [products]="productResource.value()?.products ?? []"/>
