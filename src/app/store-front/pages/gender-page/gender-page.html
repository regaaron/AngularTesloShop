<h1 class="text-2xl font-bold font-montserrat">Todos los productos
    <span class="text-accent">{{gender()}}</span>
</h1>
<h2 class="text-xl font-semibold mb-5">Para todos los gustos</h2>


<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 mt-2 gap-2">

   
    @for (product of productResource.value()?.products ; track $index) {
        <product-card [product]="product" />
    }

</div>

<app-pagination   [currentPage]="paginationService.currentPage()" [pages]="productResource.value()?.pages ?? 0"/>
